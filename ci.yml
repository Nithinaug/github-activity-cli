name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code go.sum

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build (linux)
        run: GOOS=linux GOARCH=amd64 go build -o github-activity-linux-amd64 .

      - name: Build (macOS)
        run: GOOS=darwin GOARCH=arm64 go build -o github-activity-darwin-arm64 .

      - name: Build (windows)
        run: GOOS=windows GOARCH=amd64 go build -o github-activity-windows-amd64.exe .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            github-activity-linux-amd64
            github-activity-darwin-arm64
            github-activity-windows-amd64.exe